# The single public entry point.
#
# One service behind it in Module 5, so every route lands in the same place.
# It is here from the start because short links have to resolve at the root —
# https://short.example.com/abc123 — which means the shortener must own `/`,
# and every service added later has to be routed by a prefix ABOVE that
# catch-all. Retrofitting that once clients hold live short links is painful.

upstream shortener { server shortener:8000; }

server {
    listen 80;
    server_name _;

    # A short code is short; anything long is someone probing.
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    location /api/v1/urls/ { proxy_pass http://shortener; }
    location /api/       { proxy_pass http://shortener; }
    location /admin/     { proxy_pass http://shortener; }
    location /static/    { proxy_pass http://shortener; }

    # Everything else is a short code. Must stay last.
    location / { proxy_pass http://shortener; }
}
