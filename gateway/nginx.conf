
# Only the shortener is named in an `upstream` block. nginx resolves those
# hostnames once, at startup, and refuses to start if any of them is missing —
# so listing auth and analytics here would mean one crashed service takes the
# whole gateway down with it, short links included. The shortener is different:
# it owns `/`, so a gateway without it has nothing to serve anyway, and compose
# already waits for it to be healthy.
upstream shortener { server shortener:8000; }

# Docker's embedded DNS. Needed because the two services below are resolved per
# request rather than at startup; `valid=` caps how long a stale address is
# reused after a container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # A short code is short; anything long is someone probing.
    client_max_body_size 1m;


    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;


    location /api/v1/auth/ {
        set $auth_service http://auth:8000;
        proxy_pass $auth_service$request_uri;
    }
    location /api/v1/analytics/ {
        set $analytics_service http://analytics:8000;
        proxy_pass $analytics_service$request_uri;
    }

    # Each service has its own admin and only one can own a path. The
    # shortener keeps the bare `/admin/`; the others get a suffix, which is
    # also where their ROOT_URLCONF mounts admin.site.urls.
    location /admin/auth/ {
        set $auth_admin http://auth:8000;
        proxy_pass $auth_admin$request_uri;
    }
    location /admin/analytics/ {
        set $analytics_admin http://analytics:8000;
        proxy_pass $analytics_admin$request_uri;
    }

    location /internal/ { return 404; }

    location / { proxy_pass http://shortener; }
}
