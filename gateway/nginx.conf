
upstream shortener { server shortener:8000; }
upstream auth      { server auth:8000; }
upstream analytics { server analytics:8000; }

server {
    listen 80;
    server_name _;

    # A short code is short; anything long is someone probing.
    client_max_body_size 1m;

    # $http_host, not $host: $host strips the port, so a service building an
    # absolute URL from the Host header would advertise http://localhost/abc123
    # for a gateway listening on :8000 — a link that does not resolve.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # No trailing slash after the upstream name, which matters: `http://shortener`
    # forwards the request URI untouched, while `http://shortener/` would strip
    # the matched prefix and hand Django a path its URLconf does not know.
    # nginx matches prefixes longest-first, not in file order, so these win
    # over the `/` catch-all below regardless of where they sit.

    # No views behind these yet — Module 7 adds registration, login and the
    # analytics report. Wiring them now means that module adds views only.
    location /api/v1/auth/      { proxy_pass http://auth; }
    location /api/v1/analytics/ { proxy_pass http://analytics; }

    # Each service has its own admin and only one can own a path. The
    # shortener keeps the bare `/admin/`; the others get a suffix, which is
    # also where their ROOT_URLCONF mounts admin.site.urls.
    location /admin/auth/       { proxy_pass http://auth; }
    location /admin/analytics/  { proxy_pass http://analytics; }

    # The click-write API is service-to-service only. Without this it would
    # fall through to the shortener and 404 by accident; an explicit rule
    # makes "not public" a decision rather than a side effect.
    location /internal/ { return 404; }

    # The shortener owns everything else, including `/admin/` and the `/{code}`
    # redirect. It must stay last: a short code is a single path segment and
    # would otherwise swallow the prefixes above.
    location / { proxy_pass http://shortener; }
}
