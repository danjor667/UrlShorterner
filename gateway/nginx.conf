
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;


    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;


    location /api/v1/auth/ {
        set $auth_service http://auth:8000;
        proxy_pass $auth_service$request_uri;
    }
    location /api/v1/analytics/ {
        set $analytics_service http://analytics:8000;
        proxy_pass $analytics_service$request_uri;
    }


    location /api/docs/auth/ {
        set $auth_docs http://auth:8000;
        proxy_pass $auth_docs$request_uri;
    }
    location /api/schema/auth/ {
        set $auth_schema http://auth:8000;
        proxy_pass $auth_schema$request_uri;
    }
    location /api/docs/analytics/ {
        set $analytics_docs http://analytics:8000;
        proxy_pass $analytics_docs$request_uri;
    }
    location /api/schema/analytics/ {
        set $analytics_schema http://analytics:8000;
        proxy_pass $analytics_schema$request_uri;
    }


    location /admin/auth/ {
        set $auth_admin http://auth:8000;
        proxy_pass $auth_admin$request_uri;
    }
    location /admin/analytics/ {
        set $analytics_admin http://analytics:8000;
        proxy_pass $analytics_admin$request_uri;
    }

    location /internal/ { return 404; }

    location / {
        set $shortener_service http://shortener:8000;
        proxy_pass $shortener_service$request_uri;
    }
}
