# Module 5: one service behind the gateway.
#
# The shortener is published on 8001 for direct access during development (its
# Swagger UI is at /api/docs/). Real traffic goes through the gateway on :8000,
# which is the only port a deployment would expose.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  shortener:
    build:
      context: .
      dockerfile: services/shortener/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn shortener_service.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    env_file: [.env]
    environment:
      DB_HOST: db
      STATIC_ROOT: /app/staticfiles
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/urls/').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      shortener:
        condition: service_healthy

volumes:
  postgres_data:
