
services:

  db-shortener:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    volumes:
      - shortener_db_data:/var/lib/postgresql/data
    healthcheck:
      # -d as well as -U: without it pg_isready checks a database named after
      # the user, which is not necessarily the one the service uses.
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-analytics:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  shortener:
    build:
      context: .
      dockerfile: services/shortener/Dockerfile
    env_file: [.env]
    # These win over .env, so the container always talks to its own database
    # regardless of what a laptop has in .env for local development.
    environment:
      DB_HOST: db-shortener
      DB_NAME: shortener
      DB_USER: shortener
      DB_PASSWORD: shortener
      STATIC_ROOT: /app/staticfiles
      # Clicks are reported here, but a redirect no longer waits on it — see
      # URLRedirectView. Deliberately NOT in depends_on: making the shortener
      # wait for analytics to be healthy would put link availability back
      # behind a reporting service, which is what we just stopped doing.
      ANALYTICS_URL: http://analytics:8000
    depends_on:
      db-shortener:
        condition: service_healthy
    healthcheck:
      # Probes the schema, not /api/v1/urls/: as of Module 7 the API requires a
      # token, and an unauthenticated probe would report a healthy service as
      # down. The schema view is the cheapest endpoint that stays anonymous.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/schema/').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file: [.env]
    environment:
      DB_HOST: db-auth
      DB_NAME: auth
      DB_USER: auth
      DB_PASSWORD: auth
      STATIC_ROOT: /app/staticfiles
    depends_on:
      db-auth:
        condition: service_healthy
    healthcheck:
      # No public endpoint yet (Module 7 adds them), so the schema view is the
      # cheapest thing that proves Django booted and can serve a request.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/schema/auth/').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    env_file: [.env]
    environment:
      DB_HOST: db-analytics
      DB_NAME: analytics
      DB_USER: analytics
      DB_PASSWORD: analytics
      STATIC_ROOT: /app/staticfiles
    depends_on:
      db-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/schema/analytics/').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      shortener:
        condition: service_healthy

volumes:
  # Named for its owner too — one volume per database, so a service's data can
  # be backed up, restored or thrown away without touching anyone else's.
  shortener_db_data:
  auth_db_data:
  analytics_db_data:
